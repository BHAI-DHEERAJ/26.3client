// CypherV6 - a legit client for Minecraft 26.3 (Forge)
// Built from the official Forge 26.3 MDK.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'com.cypherv6'
base.archivesName = 'cypherv6'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'cypherv6'

            // Mixin needs the config either on the command line or in the manifest.
            args "--mixin.config=cypherv6.mixins.json"
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'cypherv6', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.10')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        // Lets Mixin find our config at runtime.
        attributes['MixinConfigs'] = 'cypherv6.mixins.json'
    }
}
