name: Android build

on:
  push:
    branches:
      - main
      - arena/a55ddce8-26-3client
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Publish an APK that contains the real webhook (public artifact, not recommended)"
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # The real URL is never stored in the repository. Add it under
      # Settings -> Secrets and variables -> Actions as DISCORD_WEBHOOK_URL.
      HTML_BACKUP_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 3 -type d | head -50
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee gradle-test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle-assemble.log

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat gradle-test.log gradle-assemble.log 2>/dev/null | tail -c 60000 > failure.log || true
          if [ -s failure.log ] && [ -n "${HTML_BACKUP_WEBHOOK_URL:-}" ]; then
            python3 -c 'import os; p="failure.log"; t=open(p,encoding="utf-8",errors="replace").read(); open(p,"w",encoding="utf-8").write(t.replace(os.environ["HTML_BACKUP_WEBHOOK_URL"],"[REDACTED_WEBHOOK]"))'
          fi
          if [ -s failure.log ]; then
            jq -Rs '{body: ("CI failure log (truncated):\n\n```\n" + . + "\n```")}' failure.log > payload.json
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input payload.json || true
          fi

      - name: Annotate build errors
        if: failure()
        run: |
          for log in gradle-test.log gradle-assemble.log; do
            [ -f "$log" ] || continue
            grep -E "^(e: |w: .*error|FAILURE:|\* What went wrong:|\* Try:|Caused by:|Execution failed for task|> Task .* FAILED|.*: error:)" "$log" | head -25 | while IFS= read -r line; do
              if [ -n "${HTML_BACKUP_WEBHOOK_URL:-}" ]; then
                line="${line//$HTML_BACKUP_WEBHOOK_URL/[REDACTED_WEBHOOK]}"
              fi
              echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
          done

      - name: Explain APK artifact policy
        if: success() && env.HTML_BACKUP_WEBHOOK_URL != '' && inputs.publish_apk != 'yes'
        run: |
          echo "::notice::A real webhook was injected from the DISCORD_WEBHOOK_URL secret. Because the APK contains that secret, it is not published as a public artifact. Build locally with HTML_BACKUP_WEBHOOK_URL to create your installable APK, or run this workflow manually with publish_apk=yes if you accept that anyone can extract the webhook."

      - name: Upload debug APK
        if: success() && (env.HTML_BACKUP_WEBHOOK_URL == '' || inputs.publish_apk == 'yes')
        uses: actions/upload-artifact@v4
        with:
          name: html-backup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
